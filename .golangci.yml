version: 2

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - misspell
    - revive

  settings:
    errcheck:
      # Writing to stdout/stderr from a CLI: there is nothing useful to do with
      # the error, and checking every Fprintf would bury the code that matters.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

    gosec:
      excludes:
        # G304/G703 flag reads and writes to paths built from variables. Every
        # such path here comes from a CLI flag or the user's own data directory —
        # operating on paths the user names is the whole job of these commands.
        - G304
        - G703
        # G302 wants file permissions of 0600 or tighter, but flags directories
        # too, and a directory needs the execute bit to be usable. Data
        # directories are created 0700 deliberately, and the files inside them
        # are separately chmodded to 0600 with tests asserting it.
        - G302
        # G404 covers math/rand. Every secret here comes from crypto/rand;
        # the only weak-random use would be in test fixtures.
        - G404
        # G201 flags SQL built with fmt.Sprintf. The only interpolated values are
        # table names from a compile-time list in clientdb.syncTables and
        # predicates this package builds itself; every user-supplied value goes
        # through a ? placeholder with args passed separately. Verified by
        # reading each call site.
        - G201
        # G204 flags subprocesses with variable arguments. The arguments are
        # paths this program resolved itself — systemctl/launchctl unit paths and
        # the claude-mem plugin scripts located by glob — not user input.
        - G204
        # G306 wants 0600 on written files. Service units and launchd plists must
        # be readable by the service manager and contain no secrets; files that
        # do hold secrets are written 0600 with tests asserting it.
        - G306
        # G602 fires on internal/proto/unquote.go, where the index is bounded by
        # an explicit length check on the preceding line. Analyzer limitation.
        - G602

    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      # Tests use plenty of literals and skip errors on cleanup paths.
      - path: _test\.go
        linters: [errcheck, gosec]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
