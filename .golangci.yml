version: 2

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - misspell
    - revive

  settings:
    gosec:
      excludes:
        # G404: the only math/rand use would be in tests; crypto/rand is used
        # everywhere secrets are generated.
        - G404
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      # Table-driven tests and fixtures use plenty of literals and skip some
      # error checks on cleanup paths.
      - path: _test\.go
        linters: [errcheck, gosec]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
