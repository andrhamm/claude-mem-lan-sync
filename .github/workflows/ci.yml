name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # -race needs cgo, while release builds must set CGO_ENABLED=0. Separate
      # jobs so the two settings cannot leak into each other.
      - run: CGO_ENABLED=1 go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./test)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Captured traffic contains real prompt text and bearer tokens. Only
      # scrubbed fixtures may be committed, and this is the backstop.
      - name: no secrets or personal paths in committed fixtures
        run: |
          if [ -d testdata/fixtures ]; then
            if grep -rIl -e 'Bearer ' -e '/home/' -e '/Users/' testdata/fixtures; then
              echo "committed fixtures contain credentials or personal paths"; exit 1
            fi
            # A bare token in a JSON field matches none of the patterns above.
            # That is how a live pre-shared key once reached this directory.
            if grep -rIlE '"(token|psk|key|secret|password)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9_+/=-]{16,}"' testdata/fixtures; then
              echo "committed fixtures contain a credential-shaped field"; exit 1
            fi
            if grep -rIlE '[0-9]{3}-[0-9]{3}-[0-9]{3}' testdata/fixtures; then
              echo "committed fixtures contain a pairing code"; exit 1
            fi
          fi
          if [ -d testdata/captures-local ]; then
            echo "testdata/captures-local must never be committed"; exit 1
          fi

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: validate plugin manifests and skill frontmatter
        run: |
          python3 - <<'PY'
          import json, sys, pathlib, re

          errors = []

          market = json.load(open('.claude-plugin/marketplace.json'))
          for field in ('name', 'owner', 'plugins'):
              if field not in market:
                  errors.append(f'marketplace.json missing {field}')
          for p in market.get('plugins', []):
              for field in ('name', 'source', 'description'):
                  if field not in p:
                      errors.append(f'marketplace plugin entry missing {field}')

          plugin = json.load(open('plugin/.claude-plugin/plugin.json'))
          for field in ('name', 'version', 'description'):
              if field not in plugin:
                  errors.append(f'plugin.json missing {field}')

          for skill in pathlib.Path('plugin/skills').glob('*/SKILL.md'):
              text = skill.read_text()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
              if not m:
                  errors.append(f'{skill}: no frontmatter')
                  continue
              fm = m.group(1)
              name = re.search(r'^name:\s*(\S+)', fm, re.M)
              desc = re.search(r'^description:\s*(.+)', fm, re.M | re.S)
              if not name:
                  errors.append(f'{skill}: no name')
              elif name.group(1) != skill.parent.name:
                  errors.append(f'{skill}: name {name.group(1)} != directory {skill.parent.name}')
              if not desc or len(desc.group(1).strip()) < 40:
                  errors.append(f'{skill}: description missing or too short to match on')

          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('plugin manifests and skills look good')
          PY

  clientvalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # Validates responses against claude-mem's own rules rather than our
      # reimplementation of them, which is the only tier that can catch a
      # misunderstanding shared by our code and our tests.
      - run: cd test/clientvalidate && go test -tags clientvalidate ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
